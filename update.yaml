name: Update list
on:
  schedule:
    - cron: "17 20 * * *"   # daily, 04:17 Singapore time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert
        run: |
          curl -fsSL https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro.mini-onlydomains.txt -o src.txt
          { echo "# HaGeZi Pro mini, converted for Shadowrocket DOMAIN-SET (leading dot = domain + subdomains)"
            grep -v '^\s*#' src.txt | grep -v '^\s*$' | sed 's/^/./'; } > hagezi-pro-mini-surge.txt
          test "$(wc -l < hagezi-pro-mini-surge.txt)" -gt 10000
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add hagezi-pro-mini-surge.txt
          git diff --cached --quiet || git commit -m "Update list"
          git push
